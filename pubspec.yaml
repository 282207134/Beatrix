name: beatrix
description: Pixso Beatrix live streaming UI, built with Flutter.
publish_to: none
version: 1.0.0+1
environment:
  sdk: ^3.13.5
dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Jakarta
      fonts:
        - asset: assets/fonts/Jakarta-Regular.ttf
          weight: 400
        - asset: assets/fonts/Jakarta-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Jakarta-Bold.ttf
          weight: 700
